<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Latihan Table - Rowspan Colspan</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Latihan Tabel HTML</h1>

        <div class="table-card">

            <h2>Contoh Rowspan dan Colspan</h2>

            <table>
                <tr>
                    <td rowspan="2">N</td>
                    <td>P</td>
                    <td>Q</td>
                </tr>

                <tr>
                    <td>R</td>
                    <td>S</td>
                </tr>

                <tr>
                    <td>T</td>
                    <td colspan="2">U</td>
                </tr>
            </table>

        </div>

        <div class="info">
            <p>
                Tabel di atas menggunakan
                <span>rowspan</span> dan
                <span>colspan</span>.
            </p>
        </div>

    </div>

</body>

</html>
